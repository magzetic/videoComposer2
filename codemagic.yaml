workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_sdk: 34
      java: 17
    scripts:
      - name: Set up Gradle wrapper permissions
        script: |
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - magzetic@gmail.com
        notify:
          failure: true
          success: true
